<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#FBFAF7;font-family:Figtree,-apple-system,Segoe UI,Roboto,sans-serif;color:#1B2233;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
            <tr><td style="font-size:17px;font-weight:600;padding-bottom:24px;">Client Hub</td></tr>
            <tr><td style="font-size:24px;font-weight:600;padding-bottom:12px;">Your sign-in link</td></tr>
            <tr>
              <td style="font-size:15px;line-height:1.5;padding-bottom:24px;">
                Tap the button below to open the Client Hub. The link works once and expires in one hour.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:24px;">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
                   style="display:inline-block;background:#2F5BEA;color:#ffffff;text-decoration:none;font-weight:600;font-size:16px;padding:14px 24px;border-radius:12px;">
                  Open Client Hub
                </a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.5;color:#5B6475;">
                Didn't ask for this? You can ignore this email. Questions? Reply to
                CoachOS@AliveAndFreeConsulting.com.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
